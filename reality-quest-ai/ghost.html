<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMN College Horror Gate</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        #gameMap {
            width: 100vw;
            height: 100vh;
            background: url("horror_gmn.png") center center;
            background-size: cover;
            position: relative;
        }

        /* Dark overlay */
        #gameMap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        /* Player */
        #player {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Horror Eyes */
        .eye {
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 20px red;
            animation: blink 1s infinite alternate;
            z-index: 5;
        }

        #eye1 {
            top: 48%;
            left: 72%;
        }

        #eye2 {
            top: 48%;
            left: 73%;
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>

    <div id="gameMap">

        <div id="player"></div>

        <div class="eye" id="eye1"></div>
        <div class="eye" id="eye2"></div>

    </div>

    <script>
        let player = document.getElementById("player");

        let x = window.innerWidth / 2;
        let y = window.innerHeight - 100;

        document.addEventListener("keydown", (e) => {

            if (e.key === "ArrowLeft") x -= 10;
            if (e.key === "ArrowRight") x += 10;
            if (e.key === "ArrowUp") y -= 10;
            if (e.key === "ArrowDown") y += 10;

            player.style.left = x + "px";
            player.style.top = y + "px";
        });
    </script>

</body>

</html>
